<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Avaliação de Técnicos</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        /* Se existir static/campo.jpg (foto real), ela é usada; senão, a ilustração campo.svg. */
        body.login-campo { min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; padding:24px;
            background:url("/static/campo.jpg") center/cover no-repeat, #dfeedd url("/static/campo.svg") center/cover no-repeat; }
        body.login-campo::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg, rgba(18,48,36,.05), rgba(18,48,36,.35)); pointer-events:none; }
        .login-cartao { position:relative; width:100%; max-width:400px; background:rgba(255,254,251,.95); border-radius:18px; padding:34px 34px 26px; text-align:center;
            box-shadow:0 18px 50px rgba(10,40,25,.35); backdrop-filter:blur(4px); border-top:5px solid #e87a2e; }
        .login-cartao img.logo { max-width:150px; width:100%; height:auto; margin-bottom:12px; }
        .login-cartao h1 { margin:0 0 4px; font-size:1.7rem; text-align:center; }
        .login-cartao .subtitulo { text-align:center; margin:0 0 20px; }
        .login-cartao form { text-align:left; }
        .login-cartao label { display:block; font-size:.82rem; font-weight:700; color:var(--verde-900,#123024); margin:12px 0 6px; }
        .login-cartao input { width:100%; box-sizing:border-box; margin:0; padding:11px 14px; border-radius:10px; }
        .campo-senha { position:relative; }
        .campo-senha input { padding-right:44px; }
        .olho { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:auto; margin:0; padding:6px 8px; background:transparent; border:0; box-shadow:none; color:var(--texto-600); cursor:pointer; font-size:1.05rem; line-height:1; }
        .login-cartao button[type=submit] { width:100%; margin-top:20px; padding:12px; border-radius:10px; font-size:1rem; }
        .login-cartao .erro { text-align:left; }
    </style>
</head>
<body class="login-campo">
    <div class="login-cartao">
        <img class="logo" src="/static/logo_sistema.png" alt="Sistema FAEC · SENAR Ceará · Sindicato Rural">
        <h1>Avaliação de Técnicos</h1>
        <p class="subtitulo">Acesso do Coordenador/Supervisor</p>

        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}

        <form method="post" action="/login">
            <label for="login">Login</label>
            <input type="text" name="login" id="login" placeholder="Digite seu usuário" required autofocus>

            <label for="senha">Senha</label>
            <div class="campo-senha">
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                <button type="button" class="olho" id="ver-senha" aria-label="Mostrar senha" title="Mostrar/ocultar senha">👁</button>
            </div>

            <button type="submit">Entrar →</button>
        </form>
    </div>
    <script>
        document.getElementById('ver-senha').addEventListener('click', function () {
            var i = document.getElementById('senha');
            i.type = i.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>
</html>
